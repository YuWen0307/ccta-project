name: ccta-pipeline
channels:
  - conda-forge
  - defaults
dependencies:
  # ---- 基础 ----
  - python=3.10
  - pip

  # ---- 科学计算与影像处理（conda 包，避免编译问题）----
  - numpy>=1.24,<2.1
  - scipy>=1.10
  - scikit-image>=0.21
  - scikit-learn>=1.3
  - pandas>=2.0
  - matplotlib>=3.7
  - pyyaml>=6.0
  - tqdm>=4.65
  - pillow>=10.0

  # ---- 医学影像 IO（pip 安装）----
  - pip:
      - SimpleITK>=2.2,<2.4
      - nibabel>=5.1
      - pydicom>=2.4          # zip 内 DICOM 读取所需的底座
      - seaborn>=0.12         # 统计分布绘图
